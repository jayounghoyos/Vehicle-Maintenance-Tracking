name: CI

on:
  pull_request:
  push:
    branches: [main]

# a new push to the same pull request cancels the run still going, so the
# queue does not fill up with results nobody will read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before node: setup-node reads packageManager to know which
      # pnpm to cache, and cannot cache a store that does not exist yet
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # the lockfile is the source of truth: a dependency that drifted
      # from it fails here instead of quietly resolving to something else
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      # not the tests yet: the only suite is the scaffolder's placeholder,
      # so a green tick would promise something nobody has written. build
      # stays because tsc catches type errors the linter does not.
      - run: pnpm build
