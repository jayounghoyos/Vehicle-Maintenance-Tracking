name: CI

on:
  pull_request:
  push:
    branches: [main]

# a new push to the same pull request cancels the run still going, so the
# queue does not fill up with results nobody will read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # the integration tests talk to a real database, because the bug they
    # exist to catch, a query that loses its organization condition, is
    # invisible to a mocked query builder
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mts
          POSTGRES_PASSWORD: mts
          POSTGRES_DB: mts
        ports:
          - 5432:5432
        # steps start as soon as the container does, which is before
        # postgres is ready to answer
        options: >-
          --health-cmd "pg_isready -U mts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: mts
      DB_PASSWORD: mts
      JWT_SECRET: ci-only-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      # pnpm before node: setup-node reads packageManager to know which
      # pnpm to cache, and cannot cache a store that does not exist yet
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # the lockfile is the source of truth: a dependency that drifted
      # from it fails here instead of quietly resolving to something else
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      # build stays because tsc catches type errors the linter does not
      - run: pnpm build

      # --coverage runs the same suites, so this reports coverage rather
      # than testing twice. It includes the integration tests, which is
      # why this job has a database
      - run: pnpm --filter api test:cov
