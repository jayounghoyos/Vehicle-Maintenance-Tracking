# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render reads this when the repository is connected, so the service is
# described here where it can be reviewed alongside the code, rather than
# in a dashboard form nobody can look at afterwards.
#
# Fields are those in the blueprint spec for a web service on the docker
# runtime. Notably absent, because the spec has none: a way to choose a
# Dockerfile stage, and a pre-deploy step on the free plan.
#
# The schema line above is what an editor reads to check this file while
# it is being written. Worth keeping: Render accepts nothing it does not
# declare, and finding that out from a failed connect is a slow way to
# learn it.
services:
  - type: web
    # vercel.json forwards /api to https://<this name>.onrender.com.
    # JSON takes no comments, so the warning lives here: renaming the
    # service breaks the client, and nothing else will say so.
    name: mts-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    # the same side of the country as the database, since one request
    # here makes several round trips to it
    region: ohio
    healthCheckPath: /api/health

    # No dockerCommand. The image migrates and then serves on its own, so
    # naming a startup here would split it across two files and leave the
    # image only correct when Render is the one running it.

    # A change to the web client is not a reason to rebuild the API.
    buildFilter:
      paths:
        - apps/api/**
        # what the image is built from, beyond the api itself
        - .dockerignore
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml

    envVars:
      # sync: false means Render asks once and keeps it. A connection
      # string does not belong in a repository.
      - key: DATABASE_URL
        sync: false
      # the browser origin allowed to call this API, which is the Vercel
      # domain and so is not known until its first deploy
      - key: WEB_ORIGIN
        sync: false
      # generated by Render, so nobody has to invent one and no weak
      # default can survive into production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: '43200'
      - key: PORT
        value: '3000'
# Deliberately not here: initialDeployHook running the seed. It is the
# documented place for one-time setup, and with no shell on the free plan
# it would be the only way to seed from Render. But the seed truncates
# every table, it re-runs on any new service instance, and the database
# is seeded once from a laptop anyway. A hook that can silently empty the
# data somebody is being shown is worse than a step in the README.
